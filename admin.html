<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>상품 관리</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1a1d21; --sub:#6b7280; --accent:#e4002b; --line:#e5e7eb; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
         background:var(--bg); color:var(--text); line-height:1.5; }
  .wrap { max-width:560px; margin:0 auto; padding:24px 16px 80px; }
  h1 { font-size:20px; margin-bottom:4px; }
  .hint { font-size:13px; color:var(--sub); margin-bottom:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px; }
  label { display:block; font-size:12px; font-weight:600; margin:10px 0 4px; }
  input[type=text], input[type=url] { width:100%; padding:10px; border:1px solid var(--line); border-radius:8px; font-size:15px; }
  input[type=file] { font-size:13px; width:100%; }
  button { font:inherit; font-size:14px; font-weight:600; border:0; border-radius:8px; padding:10px 14px; cursor:pointer;
           background:#e5e7eb; color:var(--text); }
  button.primary { background:var(--accent); color:#fff; }
  button.danger { background:#fee2e2; color:#b91c1c; }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  .prev { width:100%; max-height:220px; object-fit:contain; background:var(--bg); border-radius:8px; margin-top:8px; display:none; }
  .item { display:flex; gap:12px; align-items:center; }
  .item img, .item .ph { width:64px; height:64px; border-radius:8px; object-fit:cover; background:var(--bg); flex:none;
                         display:flex; align-items:center; justify-content:center; }
  .item .t { flex:1; min-width:0; font-size:14px; font-weight:600; word-break:keep-all; }
  .item .s { font-size:11px; color:var(--sub); font-weight:400; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .mini { padding:6px 9px; font-size:12px; }
  .bar { position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:1px solid var(--line); padding:10px 16px; }
  .bar .in { max-width:560px; margin:0 auto; display:flex; gap:8px; }
  .bar button { flex:1; }
  .steps { font-size:12.5px; color:var(--sub); margin-top:8px; }
  .steps li { margin-left:18px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>상품 관리</h1>
  <p class="hint">상품을 추가·수정한 뒤 아래 <b>products.js 다운로드</b>를 누르세요. 그 파일을 GitHub의 기존 products.js와 바꿔 올리면 사이트에 반영됩니다.</p>

  <div class="card">
    <b id="formTitle">상품 추가</b>
    <label>제품명</label>
    <input type="text" id="name" placeholder="예: 제품명을 그대로 입력">
    <label>한 줄 설명 (선택)</label>
    <input type="text" id="desc">
    <label>쿠팡 파트너스 링크</label>
    <input type="url" id="link" placeholder="https://link.coupang.com/a/...">
    <label>상품 이미지 (사진 파일 또는 스크린샷)</label>
    <input type="file" id="file" accept="image/*">
    <img class="prev" id="prev" alt="">
    <div class="row">
      <button class="primary" id="save">추가</button>
      <button id="cancel" style="display:none">수정 취소</button>
    </div>
  </div>

  <div id="items"></div>

  <ul class="steps">
    <li>이미지는 자동으로 가로세로 600px 이하로 줄어들어 파일에 함께 저장됩니다.</li>
    <li>작업 중인 내용은 이 브라우저에 임시 저장되어, 다운로드 전에 창을 닫아도 남아 있습니다.</li>
  </ul>
</div>

<div class="bar"><div class="in">
  <button id="open">미리보기</button>
  <button class="primary" id="dl">products.js 다운로드</button>
</div></div>

<script src="products.js"></script>
<script>
  const KEY = "coupang_admin_draft_v1";
  let list, editing = -1, imgData = "";

  try { list = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  if (!Array.isArray(list)) list = JSON.parse(JSON.stringify(window.PRODUCTS || []));

  const $ = id => document.getElementById(id);
  const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(list)); } catch (e) { alert("임시 저장 공간이 가득 찼어요. 다운로드를 먼저 해주세요."); } };

  function resize(file) {
    return new Promise((res, rej) => {
      const fr = new FileReader();
      fr.onerror = rej;
      fr.onload = () => {
        const im = new Image();
        im.onerror = rej;
        im.onload = () => {
          const M = 600, s = Math.min(1, M / Math.max(im.width, im.height));
          const c = document.createElement("canvas");
          c.width = Math.round(im.width * s); c.height = Math.round(im.height * s);
          const x = c.getContext("2d");
          x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height);
          x.drawImage(im, 0, 0, c.width, c.height);
          res(c.toDataURL("image/jpeg", 0.85));
        };
        im.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  }

  $("file").addEventListener("change", async e => {
    const f = e.target.files[0];
    if (!f) return;
    try { imgData = await resize(f); $("prev").src = imgData; $("prev").style.display = "block"; }
    catch (err) { alert("이미지를 읽지 못했어요. 다른 파일로 시도해주세요."); }
  });

  function resetForm() {
    editing = -1; imgData = "";
    ["name", "desc", "link"].forEach(i => $(i).value = "");
    $("file").value = ""; $("prev").style.display = "none";
    $("save").textContent = "추가"; $("formTitle").textContent = "상품 추가"; $("cancel").style.display = "none";
  }

  $("cancel").onclick = resetForm;

  $("save").onclick = () => {
    const name = $("name").value.trim(), link = $("link").value.trim();
    if (!name) return alert("제품명을 입력해주세요.");
    if (!/^https?:\/\//.test(link)) return alert("링크는 https:// 로 시작해야 해요.");
    const item = { name, desc: $("desc").value.trim(), link, img: imgData };
    if (editing >= 0) list[editing] = item; else list.push(item);
    persist(); resetForm(); render();
  };

  function render() {
    const box = $("items"); box.innerHTML = "";
    list.forEach((p, i) => {
      const c = document.createElement("div"); c.className = "card";
      const r = document.createElement("div"); r.className = "item";
      if (p.img) { const im = document.createElement("img"); im.src = p.img; r.appendChild(im); }
      else { const ph = document.createElement("div"); ph.className = "ph"; ph.textContent = "🛒"; r.appendChild(ph); }
      const t = document.createElement("div"); t.className = "t";
      t.textContent = p.name;
      const s = document.createElement("div"); s.className = "s"; s.textContent = p.link;
      t.appendChild(s); r.appendChild(t); c.appendChild(r);

      const row = document.createElement("div"); row.className = "row";
      const mk = (txt, cls, fn) => { const b = document.createElement("button"); b.className = "mini " + cls; b.textContent = txt; b.onclick = fn; row.appendChild(b); };
      mk("↑", "", () => { if (i > 0) { [list[i-1], list[i]] = [list[i], list[i-1]]; persist(); render(); } });
      mk("↓", "", () => { if (i < list.length - 1) { [list[i+1], list[i]] = [list[i], list[i+1]]; persist(); render(); } });
      mk("수정", "", () => {
        editing = i; imgData = p.img || "";
        $("name").value = p.name; $("desc").value = p.desc || ""; $("link").value = p.link;
        $("file").value = "";
        if (imgData) { $("prev").src = imgData; $("prev").style.display = "block"; } else $("prev").style.display = "none";
        $("save").textContent = "저장"; $("formTitle").textContent = "상품 수정"; $("cancel").style.display = "";
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
      mk("삭제", "danger", () => { if (confirm("삭제할까요?")) { list.splice(i, 1); persist(); resetForm(); render(); } });
      c.appendChild(row); box.appendChild(c);
    });
  }

  $("dl").onclick = () => {
    const txt = "window.PRODUCTS = " + JSON.stringify(list, null, 2) + ";\n";
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([txt], { type: "text/javascript" }));
    a.download = "products.js";
    document.body.appendChild(a); a.click(); a.remove();
  };

  // 미리보기: 현재 작업 내용을 임시로 index.html 에 적용해서 새 창으로 열기
  $("open").onclick = () => {
    fetch("index.html").then(r => r.text()).then(html => {
      const inject = "<script>window.PRODUCTS=" + JSON.stringify(list).replace(/</g, "\\u003c") + ";<\/script>";
      html = html.replace('<script src="products.js"><\/script>', inject);
      const w = window.open("", "_blank");
      w.document.open(); w.document.write(html); w.document.close();
    }).catch(() => alert("미리보기는 GitHub에 올린 뒤(또는 로컬 서버)에서 동작해요. 다운로드 후 index.html 을 직접 열어 확인하세요."));
  };

  render();
</script>
</body>
</html>
